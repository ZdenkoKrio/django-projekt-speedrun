{% extends 'base.html' %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1 class="card-title">{{ band.name }}</h1>
    </div>
    <div class="card-body">
        <p><span class="label">Genre:</span> {{ band.genre }}</p>
        <p><span class="label">Year Formed:</span> {{ band.year_formed }}</p>
        <p>{{ band.biography }}</p>
    </div>
    <div class="card-footer">
        {% if user.is_authenticated %}
            <a href="{% url 'band-edit' band.pk %}" class="btn edit-link">Edit</a>
            <a href="{% url 'band-delete' band.pk %}" class="btn delete-link">Delete</a>
        {% endif %}
        <a href="{% url 'band-list' %}" class="btn back-link">Back to list</a>
    </div>
</div>
{% endblock %}
